<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Fight AC - Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b0f19; color: #94a3b8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #07090e; border-left: 1px solid #1e293b; }
        .card-bg { background-color: #111827; border: 1px solid #1f2937; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- شاشة تسجيل الدخول (تظهر إذا لم يتم تسجيل الدخول) -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-[#0b0f19] flex items-center justify-center">
        <div class="card-bg p-8 rounded-2xl shadow-2xl w-96 border border-gray-800 text-center">
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl mx-auto mb-4 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-white font-bold text-lg mb-1">Old Fight AC</h2>
            <p class="text-xs text-gray-400 mb-6">الرجاء إدخال كلمة مرور البانل للدخول</p>
            <input type="password" id="accessPassword" placeholder="كلمة المرور..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm mb-4 focus:outline-none focus:border-blue-500">
            <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-lg shadow-blue-600/30">تسجيل الدخول</button>
            <p id="errorMsg" class="text-red-500 text-xs mt-3 hidden">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <aside class="sidebar w-64 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 border-b border-gray-800 flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-sm tracking-wide">Old Fight AC</h1>
                    <span class="text-xs text-blue-400">Security System</span>
                </div>
            </div>
            <nav class="p-4 space-y-1">
                <a href="#" class="flex items-center space-x-3 space-x-reverse px-4 py-3 rounded-xl bg-blue-600/10 text-blue-400 font-medium text-sm border border-blue-500/20">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>Dashboard</span>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
            v2.11.22 - Protected
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="card-bg px-8 py-4 flex justify-between items-center border-b border-gray-800">
            <div class="flex items-center space-x-4 space-x-reverse">
                <span class="text-white font-bold text-base">Old Fight Combat Server</span>
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online
                </span>
            </div>
            <button onclick="logout()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg transition">تسجيل الخروج</button>
        </header>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card-bg p-6 rounded-2xl shadow-xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium">AVERAGE PLAYERS</p>
                        <h3 class="text-2xl font-bold text-white mt-1">11</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
                        <i class="fa-solid fa-user-group text-xl"></i>
                    </div>
                </div>
                <div class="card-bg p-6 rounded-2xl shadow-xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium">PEAK PLAYERS</p>
                        <h3 class="text-2xl font-bold text-white mt-1">45</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                </div>
                <div class="card-bg p-6 rounded-2xl shadow-xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium">ONLINE PLAYERS</p>
                        <h3 class="text-2xl font-bold text-white mt-1">9 <span class="text-xs text-gray-500">/ 128</span></h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-server text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="card-bg p-6 rounded-2xl shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-white font-bold text-sm">Players Traffic Overview</h3>
                </div>
                <div class="h-72 w-full">
                    <canvas id="playersChart"></canvas>
                </div>
            </div>

            <!-- أزرار التحكم الفوري -->
            <div class="card-bg p-5 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="triggerAction('Delete Vehicles')" class="bg-gray-800 hover:bg-red-600/20 hover:border-red-500/50 border border-gray-700 text-gray-300 hover:text-red-400 text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-car-burst"></i> Delete Vehicles
                </button>
                <button onclick="triggerAction('Delete Peds')" class="bg-gray-800 hover:bg-red-600/20 hover:border-red-500/50 border border-gray-700 text-gray-300 hover:text-red-400 text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-xmark"></i> Delete Peds
                </button>
                <button onclick="triggerAction('Delete Objects')" class="bg-gray-800 hover:bg-red-600/20 hover:border-red-500/50 border border-gray-700 text-gray-300 hover:text-red-400 text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cube"></i> Delete Objects
                </button>
            </div>
        </div>
    </main>

    <script>
        // ضع كلمة المرور الخاصة بك هنا (مثلاً: oldfight123)
        const ADMIN_PASSWORD = "123"; 

        function checkPassword() {
            const pass = document.getElementById('accessPassword').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                localStorage.setItem('isLoggedIn', 'true');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // التحقق إذا كان مسجل دخول مسبقاً في المتصفح
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
            }
        }

        // إعداد الجراف (Chart)
        const ctx = document.getElementById('playersChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'],
                datasets: [{
                    label: 'Online Players',
                    data: [12, 5, 3, 2, 18, 35, 45, 28],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.05)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(30, 41, 59, 0.5)' }, ticks: { color: '#64748b' } },
                    y: { grid: { color: 'rgba(30, 41, 59, 0.5)' }, ticks: { color: '#64748b' } }
                }
            }
        });

        function triggerAction(actionName) {
            alert('تم إرسال الأمر (' + actionName + ') بنجاح! (سيتم ربطه بسكربت الحماية في الخطوة القادمة)');
        }
    </script>
</body>
</html>
